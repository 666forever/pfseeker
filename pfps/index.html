<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seeking pfps</title>

  <link rel="icon" type="image/png" href="https://666forever.github.io/discord/assets/logored.png">
  <link rel="stylesheet" href="styles.css">
  <meta name="pfseeker-mode" content="pfp">

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=favorite,fit_screen"
  />
</head>
<body>

<header class="navbar">
  <div class="nav-left">
    <a href="/" class="logo">
      <img src="https://666forever.github.io/pfseeker-assets/logo/LOGO.svg" class="logo-img">
    </a>

    <div class="nav-center">
      <a href="/" class="icon-btn">
        <img src="https://666forever.github.io/pfseeker-assets/logo/HOME.svg" class="nav-icon">
      </a>

      <div class="nav-dropdown">
        <button class="icon-btn">
          <img src="https://666forever.github.io/pfseeker-assets/logo/EXPLORE-ALL.svg" class="nav-icon">
        </button>

        <div class="dropdown-menu">
          <a href="/" class="dropdown-item">ALL</a>
          <a href="/banners" class="dropdown-item">BANNERS</a>
          <a href="/pfps" class="dropdown-item">PFPS</a>
        </div>

      <button class="icon-btn" aria-label="Liked">
        <img src="https://666forever.github.io/pfseeker-assets/logo/LIKED.svg" class="nav-icon">
      </button>
    </div>
  </div>
</header>

<main id="gallery" class="gallery"></main>

<div id="imageModal" class="modal hidden">
  <div class="modal-overlay"></div>
  <div class="modal-content">
    <button class="modal-close">✕</button>
    <button id="modalLikeBtn" class="like-btn modal-like">
      <span class="material-symbols-outlined">favorite</span>
    </button>
    <img id="modalImage">
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
