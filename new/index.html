<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pfps & banners</title>

<link rel="icon" type="image/png" href="https://666forever.github.io/pfseeker-assets/logo/logored.png">

<style>
/* -------------------- FONTS -------------------- */

@font-face {
    font-family: "Geist";
    src: url("https://666forever.github.io/pfseeker-assets/font/Geist-Variable.ttf")
         format("truetype");
    font-weight: 100 900;
}

@font-face {
    font-family: "LibreFranklin";
    src: url("https://666forever.github.io/pfseeker-assets/font/LibreFranklin.ttf")
         format("truetype");
    font-weight: 100 900;
}

/* -------------------- ROOT -------------------- */

html {
    font-size: 16px;
}

body {
    margin: 0;
    padding: 0;
    background-color: #000;
    min-height: 100vh;
    overflow-x: hidden;
}

/* -------------------- LAYOUT -------------------- */

.page-frame {
    min-height: 100dvh;
    max-width: 2156px;
    margin: 0 auto;

    display: flex;
    flex-direction: column;
}

/* -------------------- HEADER -------------------- */

header {
    text-align: center;
}

.header-link {
    display: inline-block;
    margin-top: 2.2rem;

    font-family: "Geist", sans-serif;
    font-weight: 700;
    font-size: 0.61rem;
    letter-spacing: 0.1em;
    color: #fff;
    text-decoration: none;
}

/* -------------------- HERO -------------------- */

.hero {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden; /* critical */

    margin-top: -3rem;
}

.hero-image {
    display: grid;
    place-items: center;
}

.hero-image img {
    width: min(100vw, 120rem);
    height: auto;

    max-height: calc(110dvh - 10rem);
    max-width: 100%;

    object-fit: contain;
    display: block;
}

/* 1440+ screens */
@media (min-width: 1400px) {
    .hero-image img {
        content: url("https://666forever.github.io/pfseeker-assets/images/adaptive-header/ahe-1440.png");
    }
}

/* 4K / ultrawide */
@media (min-width: 2400px) {
    .hero-image img {
        content: url("https://666forever.github.io/pfseeker-assets/images/adaptive-header/ahe-4k.png");
    }
}

/* -------------------- SCROLL ICON -------------------- */

.scroll-icon {
    display: grid;
    place-items: center;
    transform: translateY(-1rem);
}

.mousey {
    padding: 5px 10px;
    height: 25px;
    border-radius: 25px;
    border: 2px solid #fff;
}

.scroller {
    width: 3px;
    height: 10px;
    border-radius: 25%;
    background-color: #fff;
    animation: scroll 1s cubic-bezier(.15,.41,.69,.94) infinite;
}

@keyframes scroll {
    0% { opacity: 0; }
    10% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(15px); opacity: 0.3 }
}

/* -------------------- FOOTER -------------------- */

footer {
    position: relative;

    display: grid;
    grid-template-columns: 1fr auto 1fr;
    grid-template-rows: auto auto;
    align-items: center;

    padding: 10px;
    margin-top: -3rem;

    font-family: "LibreFranklin", sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    font-weight: 800;
    color: #ccc;
}

.footer-left  { grid-column: 1; justify-self: start; }
.footer-center{ grid-column: 2; justify-self: center; }
.footer-right { grid-column: 3; justify-self: end; }

/* scroll icon row */
footer .scroll-icon {
    grid-column: 2;
    grid-row: 1;
}

/* text row */
footer .footer-left,
footer .footer-center,
footer .footer-right {
    grid-row: 2;
}
</style>
</head>
<body>

<div class="page-frame">

    <header>
        <a href="index.html" class="header-link">
            WWW.PFSEEKER.COM
        </a>
    </header>

    <section class="hero">
    <div class="hero-image">

        <picture>
            <source
                srcset="https://666forever.github.io/pfseeker-assets/images/adaptive-header/ahe-4k.png"
                media="(min-width: 2400px)"
            >
            <source
                srcset="https://666forever.github.io/pfseeker-assets/images/adaptive-header/ahe-1440.png"
                media="(min-width: 1400px)"
            >
            <img
                src="https://666forever.github.io/pfseeker-assets/images/adaptive-header/ahe-1080.png"
                alt=""
            >
        </picture>

    </div>
</section>


    <footer>

        <div class="scroll-icon">
            <div class="mousey">
                <div class="scroller"></div>
            </div>
        </div>

        <div class="footer-left">© 2025 - 2026</div>
        <div class="footer-center">ProfileSeeker</div>
        <div class="footer-right">All rights reserved.</div>

    </footer>

</div>

</body>
</html>
