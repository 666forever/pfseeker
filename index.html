<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PFSeeker</title>

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Material Symbols -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=favorite,fit_screen"
  />
</head>

<body>

  <!-- =========================
       NAVBAR
  ========================= -->
  <header class="navbar">
    <div class="nav-left">

      <!-- LOGO -->
      <a href="/" class="logo">
        <img
          src="https://666forever.github.io/pfseeker-assets/logo/LOGO.svg"
          class="logo-img"
          alt="PFSeeker"
        />
      </a>

      <div class="nav-center">

        <!-- HOME -->
        <a href="/" class="icon-btn" aria-label="Home">
          <img
            src="https://666forever.github.io/pfseeker-assets/logo/HOME.svg"
            class="nav-icon"
            alt="Home"
          />
        </a>

        <!-- EXPLORE DROPDOWN -->
        <div class="nav-dropdown">
          <button class="icon-btn" aria-label="Explore">
            <img
              src="https://666forever.github.io/pfseeker-assets/logo/EXPLORE-ALL.svg"
              class="nav-icon"
              alt="Explore"
            />
          </button>

          <div class="dropdown-menu">
            <a href="/" class="dropdown-item">ALL</a>
            <a href="/banners" class="dropdown-item">BANNERS</a>
            <a href="/pfps" class="dropdown-item">PFPS</a>
          </div>
        </div> <!-- ✅ nav-dropdown CLOSED -->

        <!-- LIKED -->
        <button class="icon-btn" aria-label="Liked">
          <img
            src="https://666forever.github.io/pfseeker-assets/logo/LIKED.svg"
            class="nav-icon"
            alt="Liked"
          />
        </button>

      </div>
    </div>
  </header>

  <!-- =========================
       GALLERY
  ========================= -->
  <main id="gallery" class="gallery"></main>

  <!-- =========================
       MODAL
  ========================= -->
  <div id="imageModal" class="modal hidden">
    <div class="modal-overlay"></div>

    <div class="modal-content">
      <button class="modal-close" aria-label="Close">✕</button>

      <button id="modalLikeBtn" class="like-btn modal-like" aria-label="Like">
        <span class="material-symbols-outlined">favorite</span>
      </button>

      <img id="modalImage" alt="Expanded image" />
    </div>
  </div>

  <!-- =========================
       SCRIPT (ONLY ONCE)
  ========================= -->
  <script type="module" src="script.js"></script>

</body>
</html>
