<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore</title>

  <link
    rel="icon"
    type="image/png"
    href="https://666forever.github.io/discord/assets/logored.png"
  />

  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0"
  />
</head>

<body>

  <main class="content">
    <div class="search-row">
      <div class="search-bar">
        <input type="search" placeholder="Search" />
        <img
          src="https://666forever.github.io/pfseeker-assets/icons/svg/search.svg"
          alt=""
          class="search-icon"
        />
      </div>
    </div>

    <div id="gallery" class="gallery"></div>
  </main>

  <!-- MODAL -->
  <div id="imageModal" class="modal hidden">
    <div class="modal-overlay"></div>

    <div class="modal-content">
      <button class="modal-close" aria-label="Close">✕</button>

      <button
        id="modalLikeBtn"
        class="like-btn modal-like"
        aria-label="Like"
      ></button>

      <img id="modalImage" alt="Expanded image" />
    </div>
  </div>

  <!-- Image sources -->
  <script src="/pfps/images_list.js"></script>
  <script src="/banners/images_list.js"></script>

  <!-- Explorer aggregation logic (NEW) -->
  <script src="/js/explore-init.js"></script>

  <!-- Shared gallery logic -->
  <script src="/script.js"></script>

  <!-- Sidebar loader -->
  <script src="/js/sidebar-loader.js"></script>
</body>
</html>
